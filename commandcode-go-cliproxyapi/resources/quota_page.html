<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommandCode 配额</title>
<style>
:root {
  --bg-primary: #f0eee8;
  --bg-secondary: #faf9f5;
  --bg-tertiary: #e9e6df;
  --text-primary: #2d2a26;
  --text-secondary: #6d6760;
  --text-tertiary: #a29c95;
  --border-color: #e3e1db;
  --primary-color: #8b8680;
  --primary-hover: #7f7a74;
  --success-color: #188038;
  --warning-color: #b06000;
  --error-color: #b3261e;
  --radius-md: 8px;
  --shadow: 0 1px 3px rgba(45, 42, 38, .12);
}
[data-theme="white"] {
  --bg-primary: #f0eee8;
  --bg-secondary: #faf9f5;
  --bg-tertiary: #e9e6df;
  --text-primary: #2d2a26;
  --text-secondary: #6d6760;
  --text-tertiary: #a29c95;
  --border-color: #e3e1db;
}
[data-theme="dark"] {
  --bg-primary: #1d1b18;
  --bg-secondary: #151412;
  --bg-tertiary: #262320;
  --text-primary: #f0eee8;
  --text-secondary: #b8b1a8;
  --text-tertiary: #8d867e;
  --border-color: #3c3833;
  --primary-color: #8f8981;
  --primary-hover: #a29b92;
  --shadow: 0 1px 3px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; padding: 32px; color: var(--text-primary); background: var(--bg-secondary); font: 14px/1.45 system-ui, sans-serif; }
.quota-page { max-width: 1160px; margin: 0 auto; }
.quota-header { margin-bottom: 24px; }
.quota-title { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; }
.quota-description { margin: 8px 0 0; color: var(--text-secondary); }
.quota-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
.quota-card { padding: 20px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: var(--shadow); }
.quota-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.credential-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; color: #fff; background: var(--primary-color); font-size: 12px; font-weight: 700; }
.credential-name { margin: 0; min-width: 0; overflow-wrap: anywhere; font-size: 16px; font-weight: 600; }
/* Plan type, spelled out. The round badge above already carries the plan, but
   it is a bare acronym that operators read as the account label; this chip
   states it in words, and shows 套餐未知 instead of hiding an unknown plan. */
.credential-plan { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-secondary); font-size: 12px; font-weight: 600; white-space: nowrap; }
.credential-plan.is-unknown { color: var(--text-tertiary); font-weight: 500; }
/* Add-key form: collapsed by default so this stays a quota view first. */
.quota-add { margin: 0 0 16px; }
.quota-add-toggle { padding: 7px 14px; border: 1px solid var(--border-color); border-radius: 999px; background: var(--bg-primary); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; }
.quota-add-toggle:hover { border-color: var(--primary-color); color: var(--primary-color); }
.quota-add-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-secondary); }
.quota-add-input { padding: 7px 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-primary); color: var(--text-primary); font-size: 13px; font-family: inherit; }
#addKey { flex: 1 1 260px; min-width: 200px; }
#addLabel { flex: 0 1 160px; }
.quota-add-submit { padding: 7px 16px; border: 1px solid var(--primary-color); border-radius: 6px; background: var(--primary-color); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
.quota-add-submit:disabled { opacity: .55; cursor: default; }
.quota-add-status { font-size: 12px; color: var(--text-secondary); }
.quota-add-status.is-error { color: var(--error-color); }
.quota-add-status.is-ok { color: var(--success-color); }
.quota-row { padding: 14px 0; border-top: 1px solid var(--border-color); }
.quota-row-header, .quota-meta { display: flex; justify-content: space-between; gap: 12px; }
.quota-label { font-weight: 600; }
.quota-percent { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.quota-track { height: 8px; margin: 8px 0 6px; overflow: hidden; border-radius: 999px; background: var(--bg-tertiary); }
.quota-fill { height: 100%; border-radius: inherit; background: var(--success-color); transition: width .2s ease; }
/* Colour grading: the bar warns before the vendor blocks the account. */
.quota-fill.is-watch { background: var(--warning-color); }
.quota-fill.is-critical { background: #d97706; }
.quota-fill.is-exceeded { background: var(--error-color); }
.quota-meta.is-exceeded { color: var(--error-color); }
.quota-meta { color: var(--text-secondary); font-size: 12px; }
.quota-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.quota-badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--border-color); color: var(--text-secondary); background: var(--bg-tertiary); }
.quota-badge.is-warn { color: var(--warning-color); border-color: currentColor; }
.quota-badge.is-danger { color: var(--error-color); border-color: currentColor; }
.quota-balances { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border-color); }
.quota-balance { display: flex; flex-direction: column; gap: 2px; }
.quota-balance-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.quota-balance-label { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
.quota-detail-toggle { margin-top: 12px; border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; color: var(--text-primary); background: var(--bg-tertiary); font: inherit; font-size: 12px; cursor: pointer; }
.quota-detail-toggle:hover { border-color: var(--primary-color); background: var(--bg-primary); }
.quota-detail { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); }
.quota-detail-item { display: flex; flex-direction: column; gap: 2px; }
.quota-detail-value { font-variant-numeric: tabular-nums; font-weight: 600; }
.quota-detail-label { color: var(--text-secondary); font-size: 11px; }
.quota-detail-note { grid-column: 1 / -1; color: var(--text-tertiary); font-size: 11px; }
.quota-actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.quota-refresh { border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; color: var(--text-primary); background: var(--bg-tertiary); font: inherit; font-size: 12px; cursor: pointer; }
.quota-refresh:hover { border-color: var(--primary-color); background: var(--bg-primary); }
.quota-refresh:disabled { cursor: not-allowed; opacity: .6; }
.quota-error { color: var(--error-color); }
.quota-warning { color: var(--warning-color); }
.quota-muted { color: var(--text-secondary); }
@media (max-width: 768px) {
  body { padding: 20px 16px; }
  .quota-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="quota-page">
  <header class="quota-header"><h1 class="quota-title">CommandCode 配额</h1><p class="quota-description">每个已配置凭据的用量。新账号会自动刷新。</p></header>
  <section class="quota-add">
    <button type="button" class="quota-add-toggle" id="addToggle" aria-expanded="false" aria-controls="addForm">＋ 添加 Key</button>
    <form class="quota-add-form" id="addForm" hidden>
      <input class="quota-add-input" id="addKey" type="password" autocomplete="off" spellcheck="false" placeholder="CommandCode key（user_…）" aria-label="CommandCode key">
      <input class="quota-add-input" id="addLabel" type="text" autocomplete="off" spellcheck="false" placeholder="备注（可选）" aria-label="备注">
      <select class="quota-add-input" id="addMode" aria-label="传输模式">
        <option value="go-cli">go-cli（Go 套餐）</option>
        <option value="provider">provider（Provider 套餐）</option>
      </select>
      <button type="submit" class="quota-add-submit" id="addSubmit">添加</button>
      <span class="quota-add-status" id="addStatus" role="status"></span>
    </form>
  </section>
  <main id="app"><p class="quota-muted">正在加载凭据…</p></main>
</div>
<script>
(() => {
  try {
    const parentDocument = window.parent && window.parent !== window ? window.parent.document : null;
    const parentRoot = parentDocument && parentDocument.documentElement;
    const syncTheme = () => {
      if (!parentRoot) return;
      const theme = parentRoot.getAttribute("data-theme");
      if (theme === "white" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      else document.documentElement.removeAttribute("data-theme");
      const secondary = getComputedStyle(parentRoot).getPropertyValue("--bg-secondary").trim();
      if (secondary) document.documentElement.style.setProperty("--bg-secondary", secondary);
      document.body.style.backgroundColor = secondary || "var(--bg-secondary)";
      if (window.frameElement) {
        window.frameElement.style.backgroundColor = secondary || "transparent";
        if (window.frameElement.parentElement) window.frameElement.parentElement.style.backgroundColor = secondary || "transparent";
      }
    };
    syncTheme();
    if (parentRoot) new MutationObserver(syncTheme).observe(parentRoot, {attributes: true, attributeFilter: ["data-theme"]});
  } catch (_) {}
})();
</script>
<script>
(() => {
  const app = document.getElementById("app");
  const endpoint = "/v0/management/plugins/commandcode-go-cliproxyapi/quota-usage";
  const accountsEndpoint = "/v0/management/plugins/commandcode-go-cliproxyapi/accounts";
  const storageKey = "commandcode-go-cliproxyapi:quota";
  const values = new Map();
  const labels = new Map();
  const fetchedAt = new Map();
  const errors = new Map();
  const inFlight = new Set();
  let cache = {};
  try {
    const stored = sessionStorage.getItem(storageKey);
    const parsed = stored ? JSON.parse(stored) : {};
    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) cache = parsed;
  } catch (_) {}
  Object.entries(cache).forEach(([keyID, entry]) => {
    if (!entry || typeof entry !== "object" || !entry.usage || typeof entry.usage !== "object") return;
    values.set(keyID, entry.usage);
    if (typeof entry.label === "string" && entry.label) labels.set(keyID, entry.label);
    if (typeof entry.fetched_at === "string") fetchedAt.set(keyID, entry.fetched_at);
  });
  function saveCache() {
    try { sessionStorage.setItem(storageKey, JSON.stringify(cache)); } catch (_) {}
  }
  function applyUsage(keyID, usage, label) {
    const timestamp = new Date().toISOString();
    values.set(keyID, usage);
    if (label) labels.set(keyID, label);
    fetchedAt.set(keyID, timestamp);
    cache[keyID] = {usage, fetched_at: timestamp, label: labels.get(keyID) || ""};
    saveCache();
  }
  function refreshCard(card, cards, alreadyQueued) {
    if (!alreadyQueued) {
      if (inFlight.has(card.key_id)) return Promise.resolve();
      inFlight.add(card.key_id);
      errors.delete(card.key_id);
      render(cards);
    }
    return request({key_id: card.key_id}).then(result => {
      inFlight.delete(card.key_id);
      if (result.error) {
        errors.set(card.key_id, result.error);
        render(cards);
        return;
      }
      if (result.email) card.email = result.email;
      applyUsage(card.key_id, result.usage, result.label);
      render(cards);
    }).catch(err => {
      inFlight.delete(card.key_id);
      errors.set(card.key_id, err.message || "刷新失败");
      render(cards);
    });
  }
  function auth() {
    const raw = localStorage.getItem("cli-proxy-auth");
    if (!raw) return "";
    try {
      let decoded = raw;
      if (raw.startsWith("enc::v1::")) {
        const bytes = Uint8Array.from(atob(raw.slice(9)), char => char.charCodeAt(0));
        const seed = new TextEncoder().encode("cli-proxy-api-webui::secure-storage|" + location.host + "|" + navigator.userAgent);
        for (let i = 0; i < bytes.length; i++) bytes[i] ^= seed[i % seed.length];
        decoded = new TextDecoder().decode(bytes);
      }
      const parsed = JSON.parse(decoded);
      if (parsed && parsed.state && parsed.state.managementKey) return typeof parsed.state.managementKey === "string" ? parsed.state.managementKey : "";
      return "";
    } catch (_) { return ""; }
  }
  function send(url, body) {
    const headers = {"Content-Type": "application/json"};
    const key = auth();
    if (key) headers.Authorization = "Bearer " + key;
    return fetch(url, {method: "POST", headers, body: JSON.stringify(body)}).then(async response => {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "请求失败");
      return data;
    });
  }
  function request(body) { return send(endpoint, body); }
  function text(parent, value) { const node = document.createElement("span"); node.textContent = value == null || value === "" ? "-" : value; parent.appendChild(node); }
  // 状态词与窗口名转中文。未知值原样透出，避免把新状态吞成空白。
  function statusText(status) {
    const map = {ok: "正常", exceeded: "已超限", unlimited: "不限量"};
    return map[status] || status || "正常";
  }
  function windowText(name) {
    const map = {fiveHour: "5 小时窗口", five_hour: "5 小时窗口", weekly: "每周窗口"};
    return map[name] || name;
  }
  function gradeClass(usage) {
    if (usage.status === "exceeded") return "is-exceeded";
    const gradePercent = Number(usage.percent) || 0;
    if (gradePercent >= 90) return "is-exceeded";
    if (gradePercent >= 75) return "is-critical";
    if (gradePercent >= 50) return "is-watch";
    return "";
  }
  function renderUsage(row, usage, extraParts, withDaysLeft) {
    const value = document.createElement("div"); value.className = "quota-percent";
    const track = document.createElement("div"); track.className = "quota-track";
    const grade = gradeClass(usage);
    const fill = document.createElement("div"); fill.className = grade ? "quota-fill " + grade : "quota-fill";
    const percent = Math.max(0, Math.min(100, Number(usage.percent) || 0));
    fill.style.width = percent + "%";
    track.setAttribute("role", "progressbar"); track.setAttribute("aria-valuemin", "0"); track.setAttribute("aria-valuemax", "100"); track.setAttribute("aria-valuenow", String(percent)); track.setAttribute("aria-label", "已用配额"); track.appendChild(fill);
    value.textContent = percent + "%";
    const meta = document.createElement("div"); meta.className = grade === "is-exceeded" ? "quota-meta is-exceeded" : "quota-meta";
    const parts = [statusText(usage.status)];
    if (Number(usage.cap) > 0) parts.push((Number(usage.used) || 0).toFixed(2) + " / " + Number(usage.cap).toFixed(2) + " 额度");
    (extraParts || []).forEach(part => parts.push(part));
    if (usage.resets_at) {
      const reset = new Date(usage.resets_at);
      parts.push("重置 " + reset.toLocaleString());
      if (withDaysLeft && !Number.isNaN(reset.getTime())) {
        const days = Math.max(0, Math.ceil((reset.getTime() - Date.now()) / 864e5));
        parts.push("剩余 " + days + " 天");
      }
    }
    text(meta, parts.join(" · "));
    row.append(value, track, meta);
  }
  const detailOpen = new Set();
  function balanceBlock(value, label) {
    const box = document.createElement("div"); box.className = "quota-balance";
    const v = document.createElement("span"); v.className = "quota-balance-value"; v.textContent = Number(value || 0).toFixed(2);
    const l = document.createElement("span"); l.className = "quota-balance-label"; l.textContent = label;
    box.append(v, l); return box;
  }
  function badge(text, kind) {
    const node = document.createElement("span");
    node.className = kind ? "quota-badge " + kind : "quota-badge";
    node.textContent = text; return node;
  }
  function badgesFor(usage) {
    const out = [];
    if (usage.exceeded_window) out.push(badge("已被拦截：" + windowText(usage.exceeded_window), "is-danger"));
    if (usage.below_threshold) out.push(badge("余额偏低", "is-warn"));
    if (usage.cancel_at_period_end) out.push(badge("本期末取消", "is-warn"));
    if (usage.pending_phase) out.push(badge("套餐变更：" + usage.pending_phase, "is-warn"));
    if (usage.limited && !usage.exceeded_window) out.push(badge("套餐受限流约束"));
    return out;
  }
  function detailItem(parent, value, label) {
    const item = document.createElement("div"); item.className = "quota-detail-item";
    const v = document.createElement("span"); v.className = "quota-detail-value"; v.textContent = value;
    const l = document.createElement("span"); l.className = "quota-detail-label"; l.textContent = label;
    item.append(v, l); parent.appendChild(item);
  }
  function detailSection(usage) {
    const u = usage.usage;
    if (!u) return null;
    const box = document.createElement("div"); box.className = "quota-detail";
    const pct = value => Number(value || 0) * (Number(value || 0) <= 1 ? 100 : 1);
    detailItem(box, String(Number(u.total_count || 0)), "请求数");
    detailItem(box, pct(u.success_rate).toFixed(1) + "%", "成功率");
    detailItem(box, String(Number(u.completed_count || 0)), "成功");
    detailItem(box, String(Number(u.failed_count || 0)), "失败");
    detailItem(box, Number(u.total_tokens_in || 0).toLocaleString(), "输入 Token");
    detailItem(box, Number(u.total_tokens_out || 0).toLocaleString(), "输出 Token");
    detailItem(box, Number(u.total_cost || 0).toFixed(2), "已消耗额度");
    if (Number(u.average_cost || 0) > 0) detailItem(box, Number(u.average_cost).toFixed(4), "单次均值");
    if (u.period_basis) {
      const note = document.createElement("div"); note.className = "quota-detail-note";
      note.textContent = "统计口径：" + u.period_basis;
      box.appendChild(note);
    }
    return box;
  }
  let cardsCount = 0;
  function render(cards) {
    cardsCount = cards.length;
    app.textContent = "";
    if (!cards.length) { const p = document.createElement("p"); p.className = "quota-muted"; p.setAttribute("role", "status"); p.textContent = "尚未配置任何凭据。"; app.appendChild(p); return; }
    const grid = document.createElement("div"); grid.className = "quota-grid";
    cards.forEach(card => {
      const section = document.createElement("section"); section.className = "quota-card";
      const header = document.createElement("div"); header.className = "quota-card-header";
      const cached = values.get(card.key_id);
      const plan = cached && cached.plan;
      const badge = document.createElement("span"); badge.className = "credential-badge"; badge.textContent = plan || "CC"; badge.setAttribute("aria-hidden", "true");
      const title = document.createElement("h2"); title.className = "credential-name"; title.textContent = labels.get(card.key_id) || card.label;
      // Spell the plan out next to the account label: the round badge is an
      // acronym an operator reads as the label, and an unknown plan must read
      // 套餐未知 rather than silently showing nothing.
      const planChip = document.createElement("span"); planChip.className = "credential-plan" + (plan ? "" : " is-unknown");
      const allowance = cached && Number(cached.plan_credits) > 0 ? " · 月额度 " + Number(cached.plan_credits).toFixed(0) : "";
      planChip.textContent = plan ? "套餐 " + plan + allowance : "套餐未知";
      header.append(badge, title, planChip); section.appendChild(header);
      [["five_hour", "5 小时窗口"], ["weekly", "每周窗口"]].forEach(entry => {
        const name = entry[0];
        const row = document.createElement("div"); row.className = "quota-row";
        const rowHeader = document.createElement("div"); rowHeader.className = "quota-row-header"; const label = document.createElement("span"); label.className = "quota-label"; label.textContent = entry[1]; rowHeader.appendChild(label); row.appendChild(rowHeader);
        const usage = values.get(card.key_id) && values.get(card.key_id)[name];
        if (usage) renderUsage(row, usage, null, name === "weekly"); else { const pending = document.createElement("div"); pending.className = "quota-meta"; pending.textContent = "尚未刷新"; row.appendChild(pending); }
        section.appendChild(row);
      });
      if (cached) {
        const balances = document.createElement("div"); balances.className = "quota-balances";
        const left = Number(cached.credits_left) || 0;
        balances.appendChild(balanceBlock(left, "剩余套餐额度"));
        if (cached.purchased_credits) balances.appendChild(balanceBlock(cached.purchased_credits, "充值额度"));
        balances.appendChild(balanceBlock(cached.free_credits, "赠送额度"));
        section.appendChild(balances);

        const row = document.createElement("div"); row.className = "quota-row";
        const rowHeader = document.createElement("div"); rowHeader.className = "quota-row-header"; const label = document.createElement("span"); label.className = "quota-label"; label.textContent = "月度额度"; rowHeader.appendChild(label); row.appendChild(rowHeader);
        const month = cached.month;
        if (month) { renderUsage(row, month, ["剩余 " + left.toFixed(2) + " 额度"], true); } else { const meta = document.createElement("div"); meta.className = "quota-meta"; text(meta, "剩余 " + left.toFixed(2) + " 额度（套餐未知）"); row.appendChild(meta); }
        section.appendChild(row);

        const badgeNodes = badgesFor(cached);
        if (badgeNodes.length) {
          const wrap = document.createElement("div"); wrap.className = "quota-badges";
          badgeNodes.forEach(node => wrap.appendChild(node));
          section.appendChild(wrap);
        }

        const detail = detailSection(cached);
        if (detail) {
          const toggle = document.createElement("button"); toggle.className = "quota-detail-toggle";
          const open = detailOpen.has(card.key_id);
          toggle.textContent = open ? "收起详情" : "详情";
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.onclick = () => {
            if (detailOpen.has(card.key_id)) detailOpen.delete(card.key_id); else detailOpen.add(card.key_id);
            render(cards);
          };
          section.appendChild(toggle);
          if (open) section.appendChild(detail);
        }
      }
      const updated = fetchedAt.get(card.key_id);
      if (updated) { const timestamp = document.createElement("div"); timestamp.className = "quota-meta"; timestamp.textContent = "更新时间 " + new Date(updated).toLocaleString(); section.appendChild(timestamp); }
      const actions = document.createElement("div"); actions.className = "quota-actions";
      const button = document.createElement("button"); button.className = "quota-refresh"; button.textContent = inFlight.has(card.key_id) ? "刷新中…" : "刷新"; button.disabled = inFlight.has(card.key_id); button.setAttribute("aria-label", "刷新 " + card.label);
      const error = document.createElement("span"); error.className = "quota-error"; error.setAttribute("role", "status"); error.textContent = errors.get(card.key_id) || "";
      button.onclick = () => { refreshCard(card, cards); };
      actions.append(button, error); section.appendChild(actions); grid.appendChild(section);
    });
    app.appendChild(grid);
  }
  if (!auth()) { app.textContent = ""; const p = document.createElement("p"); p.className = "quota-error"; p.setAttribute("role", "status"); p.textContent = "请在管理面板中开启「记住密码」后使用本页。"; app.appendChild(p); return; }
  function loadCards() {
    return request({}).then(result => {
    const cards = result.cards || [];
    const configured = new Set(cards.map(card => card.key_id));
    Object.keys(cache).forEach(keyID => {
      if (!configured.has(keyID)) { delete cache[keyID]; values.delete(keyID); labels.delete(keyID); fetchedAt.delete(keyID); }
    });
    cards.forEach(card => {
      if (card.email && !labels.has(card.key_id)) labels.set(card.key_id, card.label);
    });
    saveCache();
    const missing = cards.filter(card => !card.email);
    missing.forEach(card => inFlight.add(card.key_id));
    render(cards);
    missing.forEach(card => refreshCard(card, cards, true));
  }).catch(err => { app.textContent = ""; const p = document.createElement("p"); p.className = "quota-error"; p.setAttribute("role", "status"); p.textContent = err.message || "无法加载凭据。"; app.appendChild(p); });
  }
  // Add-key form. The host gives a plugin no way to write its own config, so
  // the key is stored as a CPA auth record: the host persists and schedules it,
  // and the plugin folds auth-record credentials into its pool. That is what
  // makes a key added here usable at once, without hand-editing config.
  (() => {
    const toggle = document.getElementById("addToggle");
    const form = document.getElementById("addForm");
    const keyInput = document.getElementById("addKey");
    const labelInput = document.getElementById("addLabel");
    const modeSelect = document.getElementById("addMode");
    const submit = document.getElementById("addSubmit");
    const status = document.getElementById("addStatus");
    if (!toggle || !form || !keyInput || !submit || !status) return;
    const setStatus = (message, kind) => { status.textContent = message || ""; status.className = "quota-add-status" + (kind ? " is-" + kind : ""); };
    toggle.addEventListener("click", () => {
      const opening = form.hidden;
      form.hidden = !opening;
      toggle.setAttribute("aria-expanded", String(opening));
      if (opening) keyInput.focus();
    });
    form.addEventListener("submit", event => {
      event.preventDefault();
      const credential = keyInput.value.trim();
      if (!credential) { setStatus("请填写 CommandCode key。", "error"); keyInput.focus(); return; }
      // A credential added to an EMPTY configuration still needs a host
      // config reload before its models appear: the host reads a plugin's
      // model list at startup / config load, not when an auth record is
      // written mid-flight. Detected here so the hint is only shown then.
      const wasEmpty = cardsCount === 0;
      submit.disabled = true;
      setStatus("正在添加…", "");
      send(accountsEndpoint, {credential, label: labelInput.value.trim(), mode: modeSelect.value}).then(result => {
        keyInput.value = ""; labelInput.value = "";
        const done = "已添加：" + (result.label || result.key_id || "成功");
        setStatus(wasEmpty ? done + "　请重启 CPA（或重新保存插件配置）以让模型列表出现。" : done, "ok");
        return loadCards();
      }).catch(err => {
        setStatus(err.message || "添加失败。", "error");
      }).then(() => { submit.disabled = false; });
    });
  })();
  loadCards();
})();
</script>
</body>
</html>
